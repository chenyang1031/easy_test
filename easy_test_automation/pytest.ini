[pytest]
# Django设置模块
DJANGO_SETTINGS_MODULE = EasyTesting.settings

# 测试发现配置
testpaths = tests
python_files = test_*.py *_test.py tests_*.py
python_classes = Test*
python_functions = test_*

# 严格标记
markers =
    slow: 标记为慢速测试
    integration: 集成测试
    unit: 单元测试
    api: API测试
    dashboard: 仪表盘测试
    performance: 性能测试

# 输出配置
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=../test_manager
    --cov-report=html:reports/coverage
    --cov-report=term-missing
    --html=reports/test_report.html
    --self-contained-html

# 测试超时
timeout = 300

# 测试过滤
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning