{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyTesting</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'svg/test.svg' %}" />

  {# ===== 字体预加载 ===== #}
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  {# ===== Bootstrap CSS（与 base.html 保持一致）===== #}
  <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/bootstrap-icons.css' %}">

  {# ===== Element Plus CSS ===== #}
  <link rel="stylesheet" href="{% static 'scene-orchestrator/assets/element-plus.css' %}">

  {# ===== 应用 CSS（由 Vite 构建产出）===== #}
  <link rel="stylesheet" href="{% static 'scene-orchestrator/assets/app-shell.css' %}">
  <link rel="stylesheet" href="{% static 'scene-orchestrator/assets/App.css' %}">

  {# ===== 全局 CSS 变量（与 base.html 保持一致）===== #}
  <style>
    :root {
      /* 主色 */
      --primary-color: #1E40AF;
      --secondary-color: #3B82F6;
      --success-color: #10B981;
      --info-color: #3B82F6;
      --warning-color: #F59E0B;
      --danger-color: #EF4444;
      --bg-body: #F1F5F9;
      --bg-body-gradient: radial-gradient(ellipse at 50% 0%, rgba(59, 130, 246, 0.03) 0%, transparent 70%);
      --bg-card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #64748B;
      --border-color: #E2E8F0;

      /* 侧栏 & 顶栏 */
      --bg-sidebar: #FFFFFF;
      --bg-navbar: rgba(255, 255, 255, 0.82);
      --navbar-blur: 12px;
      --navbar-shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 14px rgba(0,0,0,0.04);
      --navbar-border: 1px solid rgba(226, 232, 240, 0.5);
      --sidebar-text: #475569;
      --sidebar-text-muted: #94A3B8;
      --sidebar-text-active: #1E40AF;
      --sidebar-icon: #94A3B8;
      --sidebar-icon-active: #3B82F6;
      --sidebar-border: #E2E8F0;
      --sidebar-hover-bg: #F1F5F9;
      --sidebar-active-bg: rgba(30, 64, 175, 0.06);
      --sidebar-shadow: 1px 0 8px rgba(0,0,0,0.04);
      --navbar-text: #1E293B;
      --navbar-brand-text: #1E293B;

      /* 状态语义色 */
      --status-pass: #10B981;
      --status-fail: #EF4444;
      --status-running: #F59E0B;
      --status-pending: #6B7280;

      /* 卡片与深度 */
      --card-shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --card-shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --card-shadow-md: 0 4px 6px rgba(0,0,0,0.05), 0 2px 4px rgba(0,0,0,0.04);
      --card-shadow-lg: 0 10px 15px rgba(0,0,0,0.06), 0 4px 6px rgba(0,0,0,0.04);

      /* 字体 */
      --font-heading: 'Fira Code', 'Consolas', 'Courier New', monospace;
      --font-body: 'Fira Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      --font-mono: 'Fira Code', 'Consolas', 'Courier New', monospace;
    }

    .dark-mode {
      --primary-color: #3B82F6;
      --secondary-color: #60A5FA;
      --success-color: #34D399;
      --info-color: #60A5FA;
      --warning-color: #FBBF24;
      --danger-color: #F87171;
      --bg-body: #0B1120;
      --bg-body-gradient: radial-gradient(ellipse at 50% 0%, rgba(59, 130, 246, 0.04) 0%, transparent 70%);
      --bg-card: #1E293B;
      --text-primary: #F1F5F9;
      --text-secondary: #94A3B8;
      --border-color: #1E293B;
      --bg-sidebar: #0B1120;
      --bg-navbar: rgba(15, 23, 42, 0.90);
      --navbar-blur: 14px;
      --navbar-shadow: 0 1px 3px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.15);
      --navbar-border: 1px solid rgba(255,255,255,0.06);
      --sidebar-text: #94A3B8;
      --sidebar-text-muted: #64748B;
      --sidebar-text-active: #60A5FA;
      --sidebar-icon: #64748B;
      --sidebar-icon-active: #60A5FA;
      --sidebar-border: rgba(255, 255, 255, 0.05);
      --sidebar-hover-bg: rgba(59, 130, 246, 0.1);
      --sidebar-active-bg: rgba(59, 130, 246, 0.15);
      --sidebar-shadow: 1px 0 12px rgba(0,0,0,0.25);
      --navbar-text: #F1F5F9;
      --navbar-brand-text: #F1F5F9;

      /* 卡片与深度 */
      --card-shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
      --card-shadow: 0 1px 3px rgba(0,0,0,0.25), 0 1px 2px rgba(0,0,0,0.15);
      --card-shadow-md: 0 4px 6px rgba(0,0,0,0.2), 0 2px 4px rgba(0,0,0,0.15);
      --card-shadow-lg: 0 10px 15px rgba(0,0,0,0.2), 0 4px 6px rgba(0,0,0,0.12);
    }

    /* ===== 浅色模式导航栏按钮（覆盖主导航硬编码值，适配玻璃导航栏）===== */
    :root:not(.dark-mode) {
      --navbar-toggle-border: rgba(203, 213, 225, 0.7);
      --navbar-toggle-color: #64748B;
      --navbar-toggle-hover-bg: rgba(241, 245, 249, 0.7);
      --navbar-toggle-hover-color: #1E293B;
      --theme-btn-border: rgba(203, 213, 225, 0.7);
      --theme-btn-color: #64748B;
      --theme-btn-hover-color: #1E293B;
      --theme-btn-hover-bg: rgba(241, 245, 249, 0.7);
      --theme-btn-hover-border: rgba(148, 163, 184, 0.7);
      --user-btn-color: #1E293B;
      --user-btn-hover-bg: rgba(241, 245, 249, 0.7);
    }

    /* 骨架屏 — Vue 挂载前显示 */
    #app:empty {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #app:empty::before {
      content: '';
      width: 48px;
      height: 48px;
      border: 4px solid rgba(30, 64, 175, 0.2);
      border-top-color: var(--primary-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 基础样式重置 */
    *, *::before, *::after { box-sizing: border-box; }
    html { font-family: var(--font-body); }
    body {
      margin: 0; padding: 0;
      background-color: var(--bg-body);
      background-image: var(--bg-body-gradient, none);
      color: var(--text-primary);
      min-height: 100vh;
    }
    a { color: var(--primary-color); text-decoration: none; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  {# ===== 注入服务端初始状态 ===== #}
  <script>
    window.__INITIAL_STATE__ = {
      userAuthenticated: {{ user.is_authenticated|yesno:'true,false' }},
      userName: '{{ user.username|escapejs }}',
      csrfToken: '{{ csrf_token }}',
    }
  </script>

  {# ===== Vue SPA 入口 ===== #}
  <script type="module" src="{% static 'scene-orchestrator/assets/app-shell.js' %}"></script>
</body>
</html>
